name: Build Sideload IPA

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-sideload-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify App Icon
        run: |
          ICON="LedgerGlass/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          WIDTH=$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')
          test "$WIDTH" = "1024" && test "$HEIGHT" = "1024" || (echo "App Icon 必須是 1024×1024，目前為 ${WIDTH}×${HEIGHT}"; exit 1)
      - name: Build unsigned device App
        run: |
          xcodebuild -project LedgerGlass.xcodeproj -scheme LedgerGlass -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/device-build" build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package sideload IPA
        run: |
          IPA_STAGING="$RUNNER_TEMP/ledgerglass-ipa"
          mkdir -p "$IPA_STAGING/Payload"
          cp -R "$RUNNER_TEMP/device-build/Ledger Glass.app" "$IPA_STAGING/Payload/"
          cd "$IPA_STAGING"
          /usr/bin/zip -qry "$RUNNER_TEMP/LedgerGlass-sideload.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LedgerGlass-sideload-IPA
          path: ${{ runner.temp }}/LedgerGlass-sideload.ipa
          if-no-files-found: error
