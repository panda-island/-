name: Build IPA

on:
  workflow_dispatch:
    inputs:
      signed_ipa:
        description: Build a signed, installable IPA (requires Apple signing secrets)
        required: true
        default: false
        type: boolean
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: xcodebuild -project LedgerGlass.xcodeproj -scheme LedgerGlass -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO

  signed-ipa:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_ipa }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Configure Apple signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64" && test -n "$PROFILE_BASE64" && test -n "$KEYCHAIN_PASSWORD" || (echo "Required signing secrets are missing."; exit 1)
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo -n "$CERTIFICATE_BASE64" | base64 -D -o "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 -D -o "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles"
      - name: Archive
        run: xcodebuild -project LedgerGlass.xcodeproj -scheme LedgerGlass -configuration Release -archivePath "$RUNNER_TEMP/LedgerGlass.xcarchive" archive
      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID" || (echo "APPLE_TEAM_ID is missing."; exit 1)
          plutil -replace teamID -string "$APPLE_TEAM_ID" ci/ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LedgerGlass.xcarchive" -exportOptionsPlist ci/ExportOptions.plist -exportPath "$RUNNER_TEMP/export"
      - uses: actions/upload-artifact@v4
        with:
          name: LedgerGlass-IPA
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
