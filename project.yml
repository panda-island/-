name: LedgerGlass
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LedgerGlass:
    type: application
    platform: iOS
    sources:
      - path: LedgerGlass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ledgerglass
        PRODUCT_NAME: Ledger Glass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: LedgerGlass/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDisplayName: 記帳
        LSApplicationCategoryType: public.app-category.finance
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  LedgerGlass:
    build:
      targets:
        LedgerGlass: all
    run:
      config: Debug
    archive:
      config: Release
